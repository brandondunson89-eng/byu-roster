<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYU Roster</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="loginScreen" class="login-screen"><div class="login-card"><h1>BYU Roster</h1><p>Sign in to view/edit shared roster.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signInBtn">Sign In</button><button id="signUpBtn" class="secondary">Create Login</button><p id="loginMessage"></p></div></div><div id="appScreen" class="hidden"><header><div class="topbar"><div><h1>BYU Roster</h1><p id="syncStatus">Cloud syncing...</p></div><button id="signOutBtn" class="secondary small">Sign Out</button></div><div class="totals"><div class="total-box">Rev <span id="revTotal">$0</span></div><div class="total-box">NIL <span id="nilTotal">$0</span></div><div class="total-box">Mali <span id="maliTotal">$0</span></div><div class="total-box">Overall Cost <span id="overallTotal">$0</span></div></div><div class="percentages"><div class="percent-box">% of Rev <span id="revPercent">0%</span></div><div class="percent-box">% of NIL <span id="nilPercent">0%</span></div><div class="percent-box">Starter % <span id="starterPercent">0%</span></div><div class="percent-box">Bench % <span id="benchPercent">0%</span></div></div></header><main class="wrap"><section class="controls"><div><label>Player Name</label><input id="playerName" placeholder="Name recruit / walk on"></div><div><label>Height</label><input id="playerHeight" placeholder="6'5&quot;"></div><div><label>Year</label><select id="playerYear"><option>5th</option><option>Sr</option><option>Jr</option><option>So</option><option>Fr</option></select></div><div><label>Rev</label><input id="playerRev" type="number" min="0" step="1000"></div><div><label>NIL</label><input id="playerNil" type="number" min="0" step="1000"></div><div><label>Mali</label><input id="playerMali" type="number" min="0" step="1000"></div><div><label>Starting Position</label><select id="positionSelect"><option>Point Guard</option><option>Shooting Guard</option><option>Small Forward</option><option>Power Forward</option><option>Center</option><option>Recruits</option></select></div><button id="addPlayerBtn">Add Player</button></section><section class="board" id="board"></section><section class="recruits-section"><h2>Recruits</h2><div class="recruits-dropzone" id="recruitsZone" data-position="Recruits" data-slot="Recruits"></div></section><p class="hint">Recruits are excluded from totals. Type “recruit” after a name for a blue card. Type “walk on” after a name for a red card.</p></main></div><script src="config.js"></script><script src="app.js"></script></body></html>
